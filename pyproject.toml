[project]
name = "jobmatch"
version = "0.1.0"
description = "Stateful CV/job matching agent with LangGraph, FastAPI and human-in-the-loop approval"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "google-genai>=3.6.1",
    "httpx>=0.28.1",
    "langchain>=1.5.2",
    "langchain-google-genai>=4.5.2",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "langsmith>=0.16.0",
    "pdfplumber>=0.11.11",
    "pydantic>=2.14.4",
    "pytest>=9.2.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "typing-extensions>=4.16.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
